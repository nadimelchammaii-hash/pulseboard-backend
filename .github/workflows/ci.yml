name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch/PR makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Same PHP minor as the Docker image (php:8.4-fpm). Tests run against in-memory
      # sqlite with array/sync/null drivers (see phpunit.xml), so no MySQL or Redis
      # service container is needed here.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, zip, gd, exif, pcntl
          tools: composer:v2
          coverage: none

      # .env must exist before `composer install`: its post-autoload-dump hook runs
      # `artisan package:discover`, which boots the app (and the Reverb broadcaster
      # config reads REVERB_* from the environment).
      - name: Create .env
        run: cp .env.example .env

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Pest (tests)
        run: php artisan test

  # Proves the Dockerfile still builds and the image has what the app needs, so a
  # broken image is caught on the PR rather than at the next `docker compose build`.
  # Nothing is pushed anywhere.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pulseboard-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A successful build doesn't prove the PHP extensions compiled in or that
      # Composer produced an autoloader, so check both, plus the FPM config.
      - name: Smoke test image
        run: |
          docker run --rm pulseboard-backend:ci sh -c '
            php -r "foreach ([\"pdo_mysql\", \"mbstring\", \"exif\", \"pcntl\", \"bcmath\", \"gd\", \"zip\"] as \$e) { if (!extension_loaded(\$e)) { fwrite(STDERR, \"missing extension: \$e\n\"); exit(1); } } echo \"extensions ok\n\";" &&
            test -f vendor/autoload.php && echo "autoloader ok" &&
            php-fpm -t'
