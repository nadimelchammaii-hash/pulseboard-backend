# Production API server. Only ever reached by the Caddy edge proxy over the internal
# Docker network; it serves no static files (the API has none), it just hands every
# request to PHP-FPM.

# Docker's embedded DNS. Using a variable in fastcgi_pass makes nginx re-resolve
# `backend` at request time, so recreating the backend container on deploy doesn't
# leave nginx pointing at the old container's IP (a 502 we hit in dev).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location / {
        set $php_upstream backend:9000;

        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}
