; Applied on top of php.ini-production by Dockerfile.prod.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; The code is baked into the image and never changes at runtime, so PHP can skip
; re-checking file timestamps on every request.
opcache.validate_timestamps = 0
